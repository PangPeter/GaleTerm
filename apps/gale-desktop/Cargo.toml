[package]
name = "gale-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GaleTerm desktop shell (gpui + gpui-component)"

[[bin]]
name = "gale-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
async-channel = "2"
dirs.workspace = true
gale-core = { path = "../../crates/gale-core" }
gale-desktop-view = { path = "../../crates/gale-desktop-view" }
gale-ftp = { path = "../../crates/gale-ftp" }
gale-net = { path = "../../crates/gale-net" }
gale-serial = { path = "../../crates/gale-serial" }
gale-ssh = { path = "../../crates/gale-ssh" }
gale-term = { path = "../../crates/gale-term" }
gale-term-view = { path = "../../crates/gale-term-view" }
gale-vnc = { path = "../../crates/gale-vnc" }
gpui-kit.workspace = true
rust-i18n = "4.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sys-locale = "0.3"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
