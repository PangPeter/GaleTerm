[workspace]
resolver = "2"
members = [
    "crates/gale-core",
    "crates/gale-term",
    "crates/gale-ssh",
    "crates/gale-net",
    "crates/gale-serial",
    "crates/gale-ftp",
    "crates/gale-cli",
    "crates/gale-term-view",
    "apps/gale-desktop",
]
default-members = ["crates/gale-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
portable-pty = "0.8"
alacritty_terminal = "0.26"
russh = "0.65"
russh-sftp = "3.0"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
# Locked with gpui-component 0.10.0 (gpui-pre =0.3.12). Prefer meta crate gpui-kit.
gpui-kit = "0.10.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
